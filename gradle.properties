# ============================================================
# Настройки Gradle
# ============================================================
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official

# ============================================================
# Parchment-маппинги
# https://parchmentmc.org/docs/getting-started
# ============================================================
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# ============================================================
# Minecraft / NeoForge
# https://projects.neoforged.net/neoforged/neoforge
# ============================================================
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.209
loader_version_range=[1,)

# ============================================================
# Kotlin for Forge — https://modrinth.com/mod/kotlin-for-forge
# Обязательно артефакт kotlinforforge-neoforge.
# ============================================================
kotlin_version=2.1.20
kff_version=5.8.0
kff_version_range=[5.8,)

# ============================================================
# Обязательные игровые зависимости (также кладутся в GitHub Release)
# ============================================================
# Born in Chaos 1.21.1 NeoForge. Версия в mods.toml — просто "1.7.6".
chaos_version=1.7.6
chaos_version_range=[1.7,)
# Born in Configuration 1.21.1 NeoForge.
bic_version=3.2.2
bic_version_range=[3,)
# GeckoLib нужен Born in Chaos (страница версии на Modrinth помечает его как required).
geckolib_version=4.7.6
geckolib_version_range=[4.7,)

# ============================================================
# Метаданные мода
# ============================================================
mod_id=uiborninconfiguration
mod_name=UI for Born in Configuration
mod_license=MPL-2.0
mod_version=1.0.0
mod_group_id=com.uiborninconfiguration.mod
mod_authors=UI for Born in Configuration contributors
mod_description=[UI for Born in Configuration](https://github.com/Nergan/ui-born-in-configuration-mod): in-game settings for Born in Chaos.
